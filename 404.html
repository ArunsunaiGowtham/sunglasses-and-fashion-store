<!DOCTYPE html>
<html lang="en" data-theme="light" data-bs-theme="light" dir="ltr">
<head>

  <link rel="stylesheet" href="css/bootstrap.min.css">

  <script>
    (function() {
      const savedTheme = localStorage.getItem('lux_store_theme') || 'light';
      document.documentElement.setAttribute('data-theme', savedTheme);
      document.documentElement.setAttribute('data-bs-theme', savedTheme);
    })();
  </script>

<body class="bg-subtle d-flex flex-column min-vh-100">

  <!-- Header -->
  <header class="py-3 bg-surface border-bottom">
    <div class="container d-flex align-items-center justify-content-between">
      <a class="navbar-brand" href="index.html">

        <span>SOLARIS<span class="text-secondary">&</span>CO.</span>
      </a>
      <div class="d-flex align-items-center gap-2">
        <button type="button" class="theme-toggle-btn" title="Toggle Theme">
          <i class="bi bi-moon-stars-fill theme-toggle-icon"></i>
          <span class="theme-toggle-label">Dark</span>
        </button>
      </div>
    </div>
  </header>

  <!-- 404 Main Content -->
  <main class="flex-grow-1 d-flex align-items-center py-5">
    <div class="container text-center">
      <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
          <div class="display-1 fw-bold text-secondary font-heading mb-2">404</div>
          <h2 class="display-6 fw-bold mb-3">Lost in the Glare</h2>
          <p class="text-muted lead fs-6 mb-4">

          </p>
          <div class="d-flex flex-wrap justify-content-center gap-3">
            <a href="index.html" class="btn-luxury">

            <a href="shop.html" class="btn-luxury-outline">
              <i class="bi bi-bag me-1"></i> Explore Shop Catalog
            </a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="py-3 bg-surface border-top text-center text-muted small">
    <div class="container">
      © 2026 Solaris & Co. Sunglasses & Fashion Store. All rights reserved.
    </div>
  </footer>

  <script src="js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>

</html>
